<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{TITLE}} · video-maker</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; color: #ddd; font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { position: relative; width: min(96vw, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.6); border-radius: 8px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  #ui { display: flex; align-items: center; gap: 12px; width: min(96vw, calc((100vh - 90px) * 16 / 9)); font-size: 14px; }
  #ui button { background: #1c2b4a; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  #ui button:hover { background: #2a3f6e; }
  #seek { flex: 1; }
  #time { font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; color: #8fa3c8; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .render #ui { display: none; }
  body.render { background: #000; margin: 0; padding: 0; overflow: hidden; display: block; }
  .render #stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; margin: 0; }
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="ui">
    <button id="play">▶ 播放</button>
    <input id="seek" type="range" min="0" max="{{DUR}}" step="0.01" value="0">
    <span id="time">0.00 / {{DUR}}.00</span>
    <label><input id="subs" type="checkbox" checked> 字幕</label>
  </div>
  <audio id="bgm" src="audio/mix.wav" preload="auto"></audio>
  <script src="lib/themes.js"></script>
  <script src="lib/anim.js"></script>
  <script src="lib/characters.js"></script>
  <script src="lib/scenes.js"></script>
  <script src="style.js"></script>
  <script src="demo.js"></script>
</body>
</html>
